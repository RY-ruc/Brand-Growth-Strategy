<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>21. 네 가지 제안은 하나의 고객 여정으로 연결된다</title>
<desc>발표 시간: 1분  |  페이지 역할: 통합 성장 구조
1순위: 각 제안이 독립 아이디어가 아니라 하나의 고객 경험이라는 점
2순위: 일반명사 유입 / 제품 발견 / 제주와 데이터로 선택 / 경험 / 재검색 · 재방문
3순위: 캠페인·상세·랜딩·공병공간 연결 구조
강조: 콘텐츠 하나를 잘 만드는 것이 아니라, 제품 관심이 브랜드 기억으로 이어지는 경로를 설계한다.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#FAFAF7"/>
<circle cx="108.5" cy="96.0" r="4.5" fill="#B54A5E"/>
<text x="127.0" y="100.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#3F5A45;letter-spacing:4.32px;" xml:space="preserve">
<tspan x="127.0" dy="0.0">PART 3 · 전략을 실제 접점으로 옮기는 제안</tspan>
</text>
<text x="1561.1" y="101.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:500;fill:#787268;letter-spacing:3.36px;" xml:space="preserve">
<tspan x="1561.1" dy="0.0">통합 성장 구조 — 21</tspan>
</text>
