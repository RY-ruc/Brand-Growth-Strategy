<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>15. 이 전략은 과거 복원이 아니라 헤리티지의 계승이다</title>
<desc>발표 시간: 50초  |  페이지 역할: 전략 가드레일
1순위: 무엇을 바꾸고 무엇을 유지할지에 대한 기준
2순위: 과거의 제주 과거 로고·컬러·매장을 전부 되돌리지 않는다 / 증명된 헤리티지 제주를 제품·콘텐츠·공간의 선택 근거로 재배치
3순위: ‘과거의 제주’와 ‘증명된 헤리티지’ 비교
강조: 제주로 돌아가는 것이 아니라, 현재의 이니스프리가 제주를 다시 설명할 수 있게 만드는 것이다.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#FAFAF7"/>
<circle cx="108.5" cy="96.0" r="4.5" fill="#B54A5E"/>
<text x="127.0" y="100.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#3F5A45;letter-spacing:4.32px;" xml:space="preserve">
<tspan x="127.0" dy="0.0">PART 2 · 전략적 해석</tspan>
</text>
<text x="1571.7" y="101.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:500;fill:#787268;letter-spacing:3.36px;" xml:space="preserve">
<tspan x="1571.7" dy="0.0">전략 가드레일 — 15</tspan>
</text>
<line x1="104.0" y1="146.0" x2="1816.0" y2="146.0" stroke="#E8E6D6" stroke-width="1"/>
<text x="104.0" y="236.5" style="font-family:'Gowun Batang';font-size:54px;font-weight:700;fill:#253531;letter-spacing:-0.54px;" xml:space="preserve">
<tspan x="104.0" dy="0.0">이 전략은 과거 복원이 아니라 헤리티지의 계승이다</tspan>
</text>
<text x="104.0" y="310.0" style="font-family:'Noto Sans KR';font-size:30px;font-weight:300;fill:#787268;" xml:space="preserve">
<tspan x="104.0" dy="0.0">무엇을 바꾸고 무엇을 유지할지에 대한 기준</tspan>
</text>
<rect x="104.0" y="521.6" width="838.0" height="163.3" rx="14" ry="14" fill="#FFFFFF" stroke="#DDD9D1" stroke-width="1"/>
<text x="138.0" y="575.1" style="font-family:'Noto Sans KR';font-size:23px;font-weight:700;fill:#787268;letter-spacing:3.22px;" xml:space="preserve">
<tspan x="138.0" dy="0.0">과거의 제주</tspan>
</text>
<text x="138.0" y="637.4" style="font-family:'Noto Sans KR';font-size:36px;font-weight:700;fill:#253531;letter-spacing:-0.72px;" xml:space="preserve">
<tspan x="138.0" dy="0.0">과거 로고·컬러·매장을 전부 되돌리지 않는다</tspan>
</text>
<rect x="978.0" y="521.6" width="838.0" height="163.3" rx="14" ry="14" fill="#253531"/>
<text x="1012.0" y="575.1" style="font-family:'Noto Sans KR';font-size:23px;font-weight:700;fill:#E78093;letter-spacing:3.22px;" xml:space="preserve">
<tspan x="1012.0" dy="0.0">증명된 헤리티지</tspan>
</text>
<text x="1012.0" y="637.4" style="font-family:'Noto Sans KR';font-size:36px;font-weight:700;fill:#FAFAF7;letter-spacing:-0.72px;" xml:space="preserve">
<tspan x="1012.0" dy="0.0">제주를 제품·콘텐츠·공간의 선택 근거로 재배치</tspan>
</text>
<rect x="104.0" y="880.0" width="1712.0" height="116.0" rx="14" ry="14" fill="#253531"/>
<text x="136.0" y="921.4" style="font-family:'Noto Sans KR';font-size:22px;font-weight:700;fill:#E78093;letter-spacing:3.52px;" xml:space="preserve">
<tspan x="136.0" dy="0.0">강조</tspan>
</text>
<text x="213.5" y="943.6" style="font-family:'Noto Sans KR';font-size:28px;font-weight:700;fill:#FAFAF7;letter-spacing:-0.56px;" xml:space="preserve">
<tspan x="213.5" dy="0.0">제주로 돌아가는 것이 아니라, 현재의 이니스프리가 제주를 다시 설명할 수 있게 만드는 것이다.</tspan>
</text>
</svg>