<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>24. 성공은 목표 숫자가 아니라 판정 기준으로 관리한다</title>
<desc>발표 시간: 45초  |  페이지 역할: KPI 원칙
1순위: 캠페인 실행 여부가 아니라 자연 추세 대비 개선을 판정
2순위: 브랜드 검색지수 / 제주 연상 비중 / 제품-브랜드 Gap / 직접경쟁 3사 점유율 / AEO 실행 지표
3순위: 90 · 180 · 360일 게이트
강조: 캠페인을 했다는 사실이 아니라, 자연적으로 일어날 변화보다 더 좋아졌는지를 본다.
주의: AEO는 소비자 인지도 KPI가 아니라 실행 지표로 구분한다.</desc>
