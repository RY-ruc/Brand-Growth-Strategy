2순위: 90일 하락폭 축소 / 180일 브랜드 연결 / 360일 접점 · 검색 회복
3순위: 대시보드 리디자인 화면 한 장
강조: 제안이 끝난 뒤에도 같은 질문을 반복해서 확인하고, 확대·수정·중단 시점을 판단한다.
주의: 전체 화면 투어 대신 핵심 화면 한 장과 판정 로직만 보여준다.</desc>
