<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>20. 상세페이지: 제품에서 브랜드로 건너가는 다리</title>
<desc>발표 시간: 1분  |  페이지 역할: 제품-브랜드 브리지
1순위: 제품 검색을 브랜드 재검색과 재방문으로 연결
2순위: 일반명사 유입 / 성분 · 효능 / 제주 원산지 · 20년 근거 / 브랜드 스토리 · 공병공간
3순위: 상세페이지 구성 목업
강조: 제품을 팔고 끝나는 것이 아니라, 제품을 산 사람이 이니스프리를 다시 기억하게 만든다.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#FAFAF7"/>
<circle cx="108.5" cy="96.0" r="4.5" fill="#B54A5E"/>
<text x="127.0" y="100.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#3F5A45;letter-spacing:4.32px;" xml:space="preserve">
<tspan x="127.0" dy="0.0">PART 3 · 전략을 실제 접점으로 옮기는 제안</tspan>
</text>
<text x="1505.0" y="101.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:500;fill:#787268;letter-spacing:3.36px;" xml:space="preserve">
<tspan x="1505.0" dy="0.0">제품-브랜드 브리지 — 20</tspan>
</text>
