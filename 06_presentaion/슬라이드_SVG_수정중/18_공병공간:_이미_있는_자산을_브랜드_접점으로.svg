<text x="1303.3" y="509.5" style="font-family:'Noto Sans KR';font-size:23px;font-weight:700;fill:#787268;letter-spacing:3.22px;" xml:space="preserve">
<tspan x="1303.3" dy="0.0">그린사이클</tspan>
</text>
<text x="1303.3" y="609.0" style="font-family:'Noto Sans KR';font-size:84px;font-weight:700;fill:#3F5A45;letter-spacing:-1.68px;" xml:space="preserve">
