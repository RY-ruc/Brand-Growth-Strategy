<tspan x="138.0" dy="0.0">80년</tspan>
</text>
<rect x="686.7" y="456.0" width="546.7" height="218.5" rx="14" ry="14" fill="#FFFFFF" stroke="#DDD9D1" stroke-width="1"/>
