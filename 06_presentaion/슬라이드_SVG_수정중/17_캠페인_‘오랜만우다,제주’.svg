<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>17. 캠페인: ‘오랜만우다,제주’</title>
<desc>발표 시간: 1분  |  페이지 역할: 휴면 고객 재활성화
1순위: 과거 고객에게 다시 말을 거는 재회형 캠페인
2순위: 할인보다 기억과 신뢰 중심 / 그때의 성분이 지금도 유효하다는 메시지
3순위: 캠페인 무드보드와 실제 카피 예시
강조: 신규 고객을 크게 외치는 캠페인이 아니라, 이미 이니스프리를 알았던 사람에게 다시 말을 거는 캠페인이다.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#FAFAF7"/>
<circle cx="108.5" cy="96.0" r="4.5" fill="#B54A5E"/>
<text x="127.0" y="100.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:700;fill:#3F5A45;letter-spacing:4.32px;" xml:space="preserve">
<tspan x="127.0" dy="0.0">PART 3 · 전략을 실제 접점으로 옮기는 제안</tspan>
</text>
<text x="1506.4" y="101.8" style="font-family:'Noto Sans KR';font-size:24px;font-weight:500;fill:#787268;letter-spacing:3.36px;" xml:space="preserve">
<tspan x="1506.4" dy="0.0">휴면 고객 재활성화 — 17</tspan>
</text>
<line x1="104.0" y1="146.0" x2="1816.0" y2="146.0" stroke="#E8E6D6" stroke-width="1"/>
<text x="104.0" y="236.5" style="font-family:'Gowun Batang';font-size:54px;font-weight:700;fill:#253531;letter-spacing:-0.54px;" xml:space="preserve">
<tspan x="104.0" dy="0.0">캠페인: ‘오랜만우다,제주’</tspan>
</text>
<text x="104.0" y="310.0" style="font-family:'Noto Sans KR';font-size:30px;font-weight:300;fill:#787268;" xml:space="preserve">
<tspan x="104.0" dy="0.0">과거 고객에게 다시 말을 거는 재회형 캠페인</tspan>
</text>
<rect x="104.0" y="360.5" width="1712.0" height="130.0" rx="14" ry="14" fill="#FFFFFF" stroke="#DDD9D1" stroke-width="1"/>
<text x="138.0" y="427.7" style="font-family:'Noto Sans KR';font-size:26px;font-weight:700;fill:#3F5A45;letter-spacing:2.60px;" xml:space="preserve">
<tspan x="138.0" dy="0.0">01</tspan>
</text>
<text x="222.0" y="431.9" style="font-family:'Noto Sans KR';font-size:32px;font-weight:400;fill:#253531;" xml:space="preserve">
<tspan x="222.0" dy="0.0">할인보다 기억과 신뢰 중심</tspan>
</text>
<rect x="104.0" y="510.5" width="1712.0" height="130.0" rx="14" ry="14" fill="#FFFFFF" stroke="#DDD9D1" stroke-width="1"/>
<text x="138.0" y="577.7" style="font-family:'Noto Sans KR';font-size:26px;font-weight:700;fill:#3F5A45;letter-spacing:2.60px;" xml:space="preserve">
<tspan x="138.0" dy="0.0">02</tspan>
</text>
<text x="222.0" y="581.9" style="font-family:'Noto Sans KR';font-size:32px;font-weight:400;fill:#253531;" xml:space="preserve">
<tspan x="222.0" dy="0.0">그때의 성분이 지금도 유효하다는 메시지</tspan>
</text>
<rect x="104.0" y="880.0" width="1712.0" height="116.0" rx="14" ry="14" fill="#253531"/>
<text x="136.0" y="921.4" style="font-family:'Noto Sans KR';font-size:22px;font-weight:700;fill:#E78093;letter-spacing:3.52px;" xml:space="preserve">
<tspan x="136.0" dy="0.0">강조</tspan>
</text>
<text x="213.5" y="943.6" style="font-family:'Noto Sans KR';font-size:28px;font-weight:700;fill:#FAFAF7;letter-spacing:-0.56px;" xml:space="preserve">
<tspan x="213.5" dy="0.0">신규 고객을 크게 외치는 캠페인이 아니라, 이미 이니스프리를 알았던 사람에게 다시 말을 거는 캠페인이다.</tspan>
</text>
</svg>