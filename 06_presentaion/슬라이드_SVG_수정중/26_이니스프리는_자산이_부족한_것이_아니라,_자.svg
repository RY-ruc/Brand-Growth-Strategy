2순위: 전략 방향 / 90일 착수 / 3년 운영 원칙
3순위: 최종 메시지
강조: 오늘 승인받고 싶은 것은 단일 캠페인이 아니라, 자산을 소비자 선택과 브랜드 기억으로 연결하는 3년 실행 체계다.</desc>
